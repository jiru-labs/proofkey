# The same gate as `npm run verify` on ct/108: typecheck, the Node checks, the
# build, the render test against the built content script and the real
# extension in Chromium under a virtual display. No secrets: nothing here talks
# to a provider or the store.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Not in git; fetched and hash-checked. Without it the check that the
      # bundled library is the pinned one is skipped and nothing says so.
      - run: node tools/fetch-webllm-lib.mjs
      - run: xvfb-run -a npm run verify
